components:
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
    SignTimestamp:
      in: header
      name: X-Sign-Timestamp
      required: true
      schema:
        type: string
        format: date-time
    AdminAuthorization:
      in: header
      name: Authorization
      required: false
      schema:
        type: string
      description: Bearer admin token; required on protected write operations when ADMIN_BEARER_TOKEN is configured.
    DeveloperReadAuthorization:
      in: header
      name: Authorization
      required: false
      schema:
        type: string
      description: Bearer token for developer read APIs. Accepts ADMIN_BEARER_TOKEN or READONLY_BEARER_TOKEN when configured.
    CallbackToken:
      in: header
      name: X-Callback-Token
      required: false
      schema:
        type: string
      description: Required when CALLBACK_TOKEN is configured.
    CallbackTimestamp:
      in: header
      name: X-Callback-Timestamp
      required: false
      schema:
        type: string
        format: date-time
    CallbackNonce:
      in: header
      name: X-Callback-Nonce
      required: false
      schema:
        type: string
    CallbackIdempotencyKey:
      in: header
      name: X-Callback-Idempotency-Key
      required: false
      schema:
        type: string
    CallbackSignatureVersion:
      in: header
      name: X-Callback-Signature-Version
      required: false
      schema:
        type: string
        enum: [v1]
      description: Required with CALLBACK_SIGNING_SECRET.
    CallbackSignature:
      in: header
      name: X-Callback-Signature
      required: false
      schema:
        type: string
      description: Required with CALLBACK_SIGNING_SECRET.
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    MessageResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    HealthResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          type: object
          required: [status, requestId, time]
          properties:
            status:
              type: string
            requestId:
              type: string
            time:
              type: string
              format: date-time
    ReadyResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          type: object
          required: [ready, requestId, time]
          properties:
            ready:
              type: boolean
            error:
              type: string
            requestId:
              type: string
            time:
              type: string
              format: date-time
    RegisterAgentRequest:
      type: object
      required: [agentDid, didPubKey]
      properties:
        agentDid:
          type: string
        didPubKey:
          type: string
    VerifyAgentRequest:
      type: object
      required: [agentDid, message, signature]
      properties:
        agentDid:
          type: string
        message:
          type: string
        signature:
          type: string
    VerifyAgentResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          type: object
          required: [verified]
          properties:
            verified:
              type: boolean
    UpdateAgentRequest:
      type: object
      required: [agentDid, newDidPubKey, signTimestamp, proofSignature]
      properties:
        agentDid:
          type: string
        newDidPubKey:
          type: string
        signTimestamp:
          type: string
          format: date-time
        proofSignature:
          type: string
    Agent:
      type: object
      additionalProperties: true
    AgentRegisterResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          $ref: "#/components/schemas/Agent"
    CreateAccountRequest:
      type: object
      required: [agentDid]
      properties:
        agentDid:
          type: string
    Account:
      type: object
      properties:
        WalletAddress:
          type: string
        VAAccountID:
          type: string
        VACardNo:
          type: string
        AgentDID:
          type: string
        Balance:
          type: number
    CreateAccountResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          $ref: "#/components/schemas/Account"
    AgentListResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          type: array
          items:
            type: object
            additionalProperties: true
    RechargeRequest:
      type: object
      required: [amount, currency]
      properties:
        vaAccountId:
          type: string
        vaCardNo:
          type: string
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        amount:
          type: string
    RechargeListResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          type: array
          items:
            type: object
            additionalProperties: true
    AuthorizeRequest:
      type: object
      required: [agentDid, singleLimit, dailyLimit, whitelist]
      properties:
        agentDid:
          type: string
        singleLimit:
          type: string
        dailyLimit:
          type: string
        whitelist:
          type: array
          items:
            type: string
    FreezeAuthorizeRequest:
      type: object
      required: [agentDid]
      properties:
        agentDid:
          type: string
    PayRequest:
      type: object
      required: [payerDid, merchantId, currency, amount, signature]
      properties:
        payerDid:
          type: string
        merchantId:
          type: string
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        amount:
          type: string
        signature:
          type: string
    PayResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          type: object
          properties:
            transactionId:
              type: string
            status:
              type: string
    StatusCallbackRequest:
      type: object
      required: [transactionId, status]
      properties:
        transactionId:
          type: string
        status:
          type: string
          enum: [SETTLED, FAILED]
    TransactionActionRequest:
      type: object
      required: [transactionId]
      properties:
        transactionId:
          type: string
    PaymentStatusResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          type: object
          additionalProperties: true
    BalanceResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          type: object
          required: [balance]
          properties:
            balance:
              type: number
    LedgerResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          type: array
          items:
            type: object
            additionalProperties: true
    InterestQuote:
      type: object
      properties:
        accountId:
          type: string
        annualRate:
          type: number
        accruedInterest:
          type: number
        asOf:
          type: string
          format: date-time
    InterestResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          $ref: "#/components/schemas/InterestQuote"
    VATopupConfigRequest:
      type: object
      required: [accountId, autoTopupEnabled, thresholdAmount, targetAmount]
      properties:
        accountId:
          type: string
        autoTopupEnabled:
          type: boolean
        thresholdAmount:
          type: string
        targetAmount:
          type: string
    VATopupConfig:
      type: object
      properties:
        accountId:
          type: string
        autoTopupEnabled:
          type: boolean
        thresholdAmount:
          type: number
        targetAmount:
          type: number
        updatedAt:
          type: string
          format: date-time
    VATopupConfigResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          $ref: "#/components/schemas/VATopupConfig"
    VATransferRequest:
      type: object
      required: [fromAccountId, toAccountId, amount]
      properties:
        fromAccountId:
          type: string
        toAccountId:
          type: string
        amount:
          type: string
    VATransferRecord:
      type: object
      properties:
        transferId:
          type: string
        fromAccountId:
          type: string
        toAccountId:
          type: string
        amount:
          type: number
        status:
          type: string
        idempotencyKey:
          type: string
        createdAt:
          type: string
          format: date-time
    VATransferListResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/VATransferRecord"
    MetricsResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          type: object
          additionalProperties: true
    CreateDeveloperAPIKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
    DeveloperAPIKey:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        key:
          type: string
        createdAt:
          type: string
          format: date-time
    DeveloperAPIKeyResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          $ref: "#/components/schemas/DeveloperAPIKey"
    DeveloperAPIKeyListResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/DeveloperAPIKey"
    CreateDeveloperWebhookRequest:
