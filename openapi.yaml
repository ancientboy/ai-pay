openapi: 3.0.3
info:
  title: AI Pay MVP API
  version: 1.0.0
  description: OpenAPI contract for currently implemented backend endpoints.
servers:
  - url: http://127.0.0.1:8080
    description: Local backend server
tags:
  - name: system
  - name: agent
  - name: account
  - name: recharge
  - name: authorize
  - name: payment
  - name: metrics
  - name: developer
paths:
  /health:
    get:
      tags: [system]
      summary: Health check
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      tags: [system]
      summary: Readiness check
      responses:
        "200":
          description: Service ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /agent/did/register:
    post:
      tags: [agent]
      summary: Register agent DID and public key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAgentRequest"
      responses:
        "200":
          description: Agent registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /agent/did/verify:
    post:
      tags: [agent]
      summary: Verify DID signature with registered public key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyAgentRequest"
      responses:
        "200":
          description: Signature verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyAgentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /agent/did/update:
    post:
      tags: [agent]
      summary: Rotate DID public key with proof signature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentRequest"
      responses:
        "200":
          description: DID public key updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /account/create:
    post:
      tags: [account]
      summary: Create wallet and VA account for agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "200":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /agent/list:
    get:
      tags: [agent]
      summary: List agents
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentListResponse"
  /fund/recharge:
    post:
      tags: [recharge]
      summary: Recharge by VA account or card number
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RechargeRequest"
      responses:
        "200":
          description: Recharge accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /fund/recharge/list:
    get:
      tags: [recharge]
      summary: List recharge records
      parameters:
        - in: query
          name: accountId
          schema:
            type: string
          required: false
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
          required: false
      responses:
        "200":
          description: Recharge records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeListResponse"
  /authorize/payment/set:
    post:
      tags: [authorize]
      summary: Set payment authorize rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeRequest"
      responses:
        "200":
          description: Rule set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /authorize/payment/update:
    post:
      tags: [authorize]
      summary: Update payment authorize rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeRequest"
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /authorize/freeze:
    post:
      tags: [authorize]
      summary: Freeze payment authorize rule for an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreezeAuthorizeRequest"
      responses:
        "200":
          description: Rule frozen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /authorize/activate:
    post:
      tags: [authorize]
      summary: Activate payment authorize rule for an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreezeAuthorizeRequest"
      responses:
        "200":
          description: Rule activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /payment/x402/pay:
    post:
      tags: [payment]
      summary: Execute x402 payment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SignTimestamp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayRequest"
      responses:
        "200":
          description: Payment response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payment/status/callback:
    post:
      tags: [payment]
      summary: Resolve settling status from channel callback
      parameters:
        - $ref: "#/components/parameters/CallbackToken"
        - $ref: "#/components/parameters/CallbackTimestamp"
        - $ref: "#/components/parameters/CallbackNonce"
        - $ref: "#/components/parameters/CallbackIdempotencyKey"
        - $ref: "#/components/parameters/CallbackSignatureVersion"
        - $ref: "#/components/parameters/CallbackSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusCallbackRequest"
      responses:
        "200":
          description: Callback accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Callback auth/signature failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Callback replay or idempotency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payment/unfreeze:
    post:
      tags: [payment]
      summary: Unfreeze a settling payment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionActionRequest"
      responses:
        "200":
          description: Unfreeze success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /payment/refund:
    post:
      tags: [payment]
      summary: Refund a settled payment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionActionRequest"
      responses:
        "200":
          description: Refund success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /payment/status/query:
    get:
      tags: [payment]
      summary: Query payment status by transaction ID
      parameters:
        - in: query
          name: transactionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatusResponse"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /account/balance/query:
    get:
      tags: [account]
      summary: Query VA balance
      parameters:
        - in: query
          name: accountId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalanceResponse"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /account/ledger/query:
    get:
      tags: [account]
      summary: Query VA ledger
      parameters:
        - in: query
          name: accountId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ledger entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LedgerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /account/interest/query:
    get:
      tags: [account]
      summary: Query estimated account interest
      parameters:
        - in: query
          name: accountId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Interest quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /account/va/topup/config:
    get:
      tags: [account]
      summary: Query VA auto topup config
      parameters:
        - in: query
          name: accountId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Topup config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VATopupConfigResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [account]
      summary: Set VA auto topup config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VATopupConfigRequest"
      responses:
        "200":
          description: Topup config updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VATopupConfigResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /account/va/transfer:
    post:
      tags: [account]
      summary: Transfer amount between VA accounts
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VATransferRequest"
      responses:
        "200":
          description: Transfer accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /metrics/overview:
    get:
      tags: [metrics]
      summary: Query overview metrics
      responses:
        "200":
          description: Metrics payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"
        "500":
          description: Failed to query metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /developer/api-keys:
    get:
      tags: [developer]
      summary: List developer API keys (masked)
      parameters:
        - $ref: "#/components/parameters/DeveloperReadAuthorization"
      responses:
        "200":
          description: API key list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperAPIKeyListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [developer]
      summary: Create developer API key (plaintext only returned once)
      parameters:
        - $ref: "#/components/parameters/AdminAuthorization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeveloperAPIKeyRequest"
      responses:
        "200":
          description: API key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperAPIKeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [developer]
      summary: Delete developer API key by ID
      parameters:
        - $ref: "#/components/parameters/AdminAuthorization"
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: API key deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /developer/webhooks:
    get:
      tags: [developer]
      summary: List developer webhooks
      parameters:
        - $ref: "#/components/parameters/DeveloperReadAuthorization"
      responses:
        "200":
          description: Webhook list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperWebhookListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /developer/webhook-deliveries:
    get:
      tags: [developer]
      summary: List webhook delivery tasks
      parameters:
        - $ref: "#/components/parameters/DeveloperReadAuthorization"
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [PENDING, RETRYING, SENT, DEAD]
        - in: query
          name: event
          required: false
          schema:
            type: string
        - in: query
          name: webhookId
          required: false
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Delivery task list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /developer/webhook-deliveries/stats:
    get:
      tags: [developer]
      summary: Query webhook delivery status counters
      parameters:
        - $ref: "#/components/parameters/DeveloperReadAuthorization"
      responses:
        "200":
          description: Delivery stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookDeliveryStatsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /developer/webhook-deliveries/replay:
    post:
      tags: [developer]
      summary: Replay one webhook delivery task
      parameters:
        - $ref: "#/components/parameters/AdminAuthorization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayWebhookDeliveryRequest"
      responses:
        "200":
          description: Replay accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [developer]
      summary: Create developer webhook
      parameters:
        - $ref: "#/components/parameters/AdminAuthorization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeveloperWebhookRequest"
      responses:
        "200":
          description: Webhook created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperWebhookResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [developer]
      summary: Delete developer webhook by ID
      parameters:
        - $ref: "#/components/parameters/AdminAuthorization"
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Webhook deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
    SignTimestamp:
      in: header
      name: X-Sign-Timestamp
      required: true
      schema:
        type: string
        format: date-time
    AdminAuthorization:
      in: header
      name: Authorization
      required: false
      schema:
        type: string
      description: Bearer admin token; required on protected write operations when ADMIN_BEARER_TOKEN is configured.
    DeveloperReadAuthorization:
      in: header
      name: Authorization
      required: false
      schema:
        type: string
      description: Bearer token for developer read APIs. Accepts ADMIN_BEARER_TOKEN or READONLY_BEARER_TOKEN when configured.
    CallbackToken:
      in: header
      name: X-Callback-Token
      required: false
      schema:
        type: string
      description: Required when CALLBACK_TOKEN is configured.
    CallbackTimestamp:
      in: header
      name: X-Callback-Timestamp
      required: false
      schema:
        type: string
        format: date-time
    CallbackNonce:
      in: header
      name: X-Callback-Nonce
      required: false
      schema:
        type: string
    CallbackIdempotencyKey:
      in: header
      name: X-Callback-Idempotency-Key
      required: false
      schema:
        type: string
    CallbackSignatureVersion:
      in: header
      name: X-Callback-Signature-Version
      required: false
      schema:
        type: string
        enum: [v1]
      description: Required with CALLBACK_SIGNING_SECRET.
    CallbackSignature:
      in: header
      name: X-Callback-Signature
      required: false
      schema:
        type: string
      description: Required with CALLBACK_SIGNING_SECRET.
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    MessageResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    HealthResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          type: object
          required: [status, requestId, time]
          properties:
            status:
              type: string
            requestId:
              type: string
            time:
              type: string
              format: date-time
    ReadyResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          type: object
          required: [ready, requestId, time]
          properties:
            ready:
              type: boolean
            error:
              type: string
            requestId:
              type: string
            time:
              type: string
              format: date-time
    RegisterAgentRequest:
      type: object
      required: [agentDid, didPubKey]
      properties:
        agentDid:
          type: string
        didPubKey:
          type: string
    VerifyAgentRequest:
      type: object
      required: [agentDid, message, signature]
      properties:
        agentDid:
          type: string
        message:
          type: string
        signature:
          type: string
    VerifyAgentResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          type: object
          required: [verified]
          properties:
            verified:
              type: boolean
    UpdateAgentRequest:
      type: object
      required: [agentDid, newDidPubKey, signTimestamp, proofSignature]
      properties:
        agentDid:
          type: string
        newDidPubKey:
          type: string
        signTimestamp:
          type: string
          format: date-time
        proofSignature:
          type: string
    Agent:
      type: object
      additionalProperties: true
    AgentRegisterResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          $ref: "#/components/schemas/Agent"
    CreateAccountRequest:
      type: object
      required: [agentDid]
      properties:
        agentDid:
          type: string
    Account:
      type: object
      properties:
        WalletAddress:
          type: string
        VAAccountID:
          type: string
        VACardNo:
          type: string
        AgentDID:
          type: string
        Balance:
          type: number
    CreateAccountResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          $ref: "#/components/schemas/Account"
    AgentListResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          type: array
          items:
            type: object
            additionalProperties: true
    RechargeRequest:
      type: object
      required: [amount]
      properties:
        vaAccountId:
          type: string
        vaCardNo:
          type: string
        amount:
          type: string
    RechargeListResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          type: array
          items:
            type: object
            additionalProperties: true
    AuthorizeRequest:
      type: object
      required: [agentDid, singleLimit, dailyLimit, whitelist]
      properties:
        agentDid:
          type: string
        singleLimit:
          type: string
        dailyLimit:
          type: string
        whitelist:
          type: array
          items:
            type: string
    FreezeAuthorizeRequest:
      type: object
      required: [agentDid]
      properties:
        agentDid:
          type: string
    PayRequest:
      type: object
      required: [payerDid, merchantId, amount, signature]
      properties:
        payerDid:
          type: string
        merchantId:
          type: string
        amount:
          type: string
        signature:
          type: string
    PayResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          type: object
          properties:
            transactionId:
              type: string
            status:
              type: string
    StatusCallbackRequest:
      type: object
      required: [transactionId, status]
      properties:
        transactionId:
          type: string
        status:
          type: string
          enum: [SETTLED, FAILED]
    TransactionActionRequest:
      type: object
      required: [transactionId]
      properties:
        transactionId:
          type: string
    PaymentStatusResponse:
      type: object
      required: [code, data]
      properties:
        code:
          type: string
        data:
          type: object
