openapi: 3.0.3
info:
  title: AI Pay MVP API
  version: 1.0.0
  description: |
    OpenAPI contract for backend endpoints.
    Milestone M6 (`/fund/transfer`, ...) requires `FEATURE_M6_FUNDS=true`.
    Milestone M7 (`/payment/card/*`, `/risk/*`) requires `FEATURE_M7_CARD_RISK=true`.
    Milestone M8 (`/wallet/*`, `/authorize/session/*`, `/payment/sign/*`) requires `FEATURE_M8_SELF_HOSTED=true`.
servers:
  - url: http://127.0.0.1:8080
    description: Local backend server
tags:
  - name: system
  - name: agent
  - name: account
  - name: recharge
  - name: funds
  - name: authorize
  - name: payment
  - name: risk
  - name: custody
  - name: metrics
  - name: developer
paths:
  /health:
    get:
      tags: [system]
      summary: Health check
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      tags: [system]
      summary: Readiness check
      responses:
        "200":
          description: Service ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /agent/did/register:
    post:
      tags: [agent]
      summary: Register agent DID and public key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAgentRequest"
      responses:
        "200":
          description: Agent registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /agent/did/verify:
    post:
      tags: [agent]
      summary: Verify DID signature with registered public key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyAgentRequest"
      responses:
        "200":
          description: Signature verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyAgentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /agent/did/update:
    post:
      tags: [agent]
      summary: Rotate DID public key with proof signature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentRequest"
      responses:
        "200":
          description: DID public key updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /account/create:
    post:
      tags: [account]
      summary: Create wallet and VA account for agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "200":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAccountResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /agent/list:
    get:
      tags: [agent]
      summary: List agents
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentListResponse"
  /fund/recharge:
    post:
      tags: [recharge]
      summary: Recharge by VA account or card number
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RechargeRequest"
      responses:
        "200":
          description: Recharge accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /fund/recharge/list:
    get:
      tags: [recharge]
      summary: List recharge records
      parameters:
        - in: query
          name: accountId
          schema:
            type: string
          required: false
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
          required: false
      responses:
        "200":
          description: Recharge records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeListResponse"
  /fund/recharge/address:
    get:
      tags: [recharge]
      summary: Query recharge address by mode and currency
      parameters:
        - in: query
          name: agentDid
          required: true
          schema: { type: string }
        - in: query
          name: currency
          required: true
          schema: { $ref: "#/components/schemas/CurrencyCode" }
        - in: query
          name: mode
          required: false
          schema:
            type: string
            enum: [platform, self_hosted]
      responses:
        "200":
          description: Recharge target address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeAddressResponse"
  /fund/recharge/confirm:
    get:
      tags: [recharge]
      summary: Query recharge confirmation depth
      parameters:
        - in: query
          name: rechargeId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Recharge confirmation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeConfirmResponse"
  /fund/recharge/callback:
    post:
      tags: [recharge]
      summary: Handle recharge callback
      parameters:
        - $ref: "#/components/parameters/CallbackToken"
        - $ref: "#/components/parameters/CallbackTimestamp"
        - $ref: "#/components/parameters/CallbackNonce"
        - $ref: "#/components/parameters/CallbackIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RechargeCallbackRequest"
      responses:
        "200":
          description: Callback processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RechargeConfirmResponse"
  /fund/transfer:
    post:
      tags: [funds]
      summary: Transfer balance between VA accounts (M6)
      description: Requires FEATURE_M6_FUNDS and admin bearer token.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AdminAuthorization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FundTransferRequest"
      responses:
        "200":
          description: Transfer completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: M6 disabled or not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /fund/withdraw:
    post:
      tags: [funds]
      summary: Submit fiat withdrawal request (M6)
      description: Debits VA balance immediately; external payout is asynchronous in MVP.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AdminAuthorization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FundWithdrawRequest"
      responses:
        "200":
          description: Withdrawal recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundWithdrawResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: M6 disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /authorize/payment/set:
    post:
      tags: [authorize]
      summary: Set payment authorize rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeRequest"
      responses:
        "200":
          description: Rule set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /authorize/payment/update:
    post:
      tags: [authorize]
      summary: Update payment authorize rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeRequest"
      responses:
        "200":
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /authorize/freeze:
    post:
      tags: [authorize]
      summary: Freeze payment authorize rule for an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreezeAuthorizeRequest"
      responses:
        "200":
          description: Rule frozen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /authorize/activate:
    post:
      tags: [authorize]
      summary: Activate payment authorize rule for an agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FreezeAuthorizeRequest"
      responses:
        "200":
          description: Rule activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /payment/x402/pay:
    post:
      tags: [payment]
      summary: Execute x402 payment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SignTimestamp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayRequest"
      responses:
        "200":
          description: Payment response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payment/status/callback:
    post:
      tags: [payment]
      summary: Resolve settling status from channel callback
      parameters:
        - $ref: "#/components/parameters/CallbackToken"
        - $ref: "#/components/parameters/CallbackTimestamp"
        - $ref: "#/components/parameters/CallbackNonce"
        - $ref: "#/components/parameters/CallbackIdempotencyKey"
        - $ref: "#/components/parameters/CallbackSignatureVersion"
        - $ref: "#/components/parameters/CallbackSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusCallbackRequest"
      responses:
        "200":
          description: Callback accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Callback auth/signature failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Callback replay or idempotency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payment/unfreeze:
    post:
      tags: [payment]
      summary: Unfreeze a settling payment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionActionRequest"
      responses:
        "200":
          description: Unfreeze success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /payment/refund:
    post:
      tags: [payment]
      summary: Refund a settled payment
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionActionRequest"
      responses:
        "200":
          description: Refund success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /payment/status/query:
    get:
      tags: [payment]
      summary: Query payment status by transaction ID
      parameters:
        - in: query
          name: transactionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatusResponse"
        "404":
          description: Transaction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payment/debit/preview:
    post:
      tags: [payment]
      summary: Debit fee preview snapshot (M6)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SignTimestamp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DebitPreviewRequest"
      responses:
        "200":
          description: Preview created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DebitPreviewResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: M6 disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payment/x402/check:
    post:
      tags: [payment]
      summary: Check x402 settlement status (M6)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/X402CheckRequest"
      responses:
        "200":
          description: Settlement info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/X402CheckResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Not found or M6 disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payment/x402/transfer:
    post:
      tags: [payment]
      summary: On-chain outbound transfer after reference payment (M6)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AdminAuthorization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/X402OutboundTransferRequest"
      responses:
        "200":
          description: Transfer recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: M6 disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payment/refund/apply:
    post:
      tags: [payment]
      summary: Signed refund apply for settled payments (M6)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SignTimestamp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundApplyRequest"
      responses:
        "200":
          description: Refund processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: M6 disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payment/card/apply:
    post:
      tags: [payment]
      summary: Issue sandbox virtual card (M7)
      description: Requires FEATURE_M7_CARD_RISK and admin token. Sandbox only — no production card network.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AdminAuthorization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardApplyRequest"
      responses:
        "200":
          description: Card issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualCardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: M7 disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payment/card/pay:
    post:
      tags: [payment]
      summary: Pay with sandbox virtual card (M7)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SignTimestamp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardPayRequest"
      responses:
        "200":
          description: Debit recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardPayResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: M7 disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payment/card/manage:
    put:
      tags: [payment]
      summary: Freeze/unfreeze/adjust sandbox card limit (M7)
      parameters:
        - $ref: "#/components/parameters/AdminAuthorization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardManageRequest"
      responses:
        "200":
          description: Card updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualCardResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: M7 disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /risk/transaction/check:
    post:
      tags: [risk]
      summary: Rule-based transaction risk check (M7)
      parameters:
        - $ref: "#/components/parameters/DeveloperReadAuthorization"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskTransactionCheckRequest"
      responses:
        "200":
          description: Decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskTransactionCheckResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: M7 disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /risk/kyc/verify:
    post:
      tags: [risk]
      summary: Party KYC sandbox verification by Agent DID (M7)
      description: >
        Verifies the human/legal funding party bound to agentDid (not an AI runtime).
        Production integrations should replace sandbox stub with regulated identity vendors.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SignTimestamp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskKYCVerifyRequest"
      responses:
        "200":
          description: KYC status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartyKYCResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: M7 disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /risk/audit/query:
    get:
      tags: [risk]
      summary: Query risk audit entries (M7)
      parameters:
        - $ref: "#/components/parameters/DeveloperReadAuthorization"
        - in: query
          name: agentDid
          schema:
            type: string
        - in: query
          name: merchantId
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: offset
          schema:
            type: integer
      responses:
        "200":
          description: Audit rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskAuditListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: M7 disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wallet/bind:
    post:
      tags: [custody]
      summary: Bind external wallet address for self-custody flows (M8)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SignTimestamp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletBindRequest"
      responses:
        "200":
          description: Bound
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: M8 disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wallet/unbind:
    post:
      tags: [custody]
      summary: Unbind wallet (M8)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SignTimestamp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletUnbindRequest"
      responses:
        "200":
          description: Unbound
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: M8 disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /authorize/session/create:
    post:
      tags: [authorize]
      summary: Create time-bounded authorization session (M8)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SignTimestamp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreateRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: M8 disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /authorize/session/revoke:
    post:
      tags: [authorize]
      summary: Revoke authorization session (M8)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SignTimestamp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRevokeRequest"
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: M8 disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payment/sign/request:
    post:
      tags: [payment]
      summary: Create pending payment signature request (M8)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/SignTimestamp"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentSignRequestBody"
      responses:
        "200":
